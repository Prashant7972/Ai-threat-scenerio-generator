services:
  # 1. Run unit test suite (101 tests)
  test:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pytest", "tests/", "-v"]

  # 2. Run code quality linter (ruff)
  lint:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["ruff", "check", "."]

  # 3. Run the 1,040-trial evaluation release protocol
  evaluate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "src.proof.evaluator.runner", "--mode", "mock"]

  # 4. Audit scenario review ledger and change management (GEN 05)
  audit:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "src.generator.change_manager", "--check"]

  # 5. Serve the ATLAS Red-Team Web Console UI
  console:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: ["python3", "-m", "http.server", "8000", "--directory", "ui"]
