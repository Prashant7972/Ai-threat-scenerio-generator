name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

  audit:
    name: Scenario & Cryptographic Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Scenario Review Ledger (GEN 05)
        run: |
          python3 -m src.generator.change_manager --check

      - name: Run Preflight Capability & Cost Evaluation
        run: |
          python3 -m src.proof.evaluator.runner --mode mock --preflight-only

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest (101 Unit & Integration Tests)
        run: |
          mkdir -p test-reports
          pytest tests/ -v --junitxml=test-reports/junit-${{ matrix.python-version }}.xml

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-reports/
          retention-days: 14

  docker:
    name: Docker Build & In-Container Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Production Docker Image
        run: |
          docker build -t ai-threat-scenario-generator:ci .

      - name: Run Full Test Suite Inside Container
        run: |
          docker run --rm ai-threat-scenario-generator:ci pytest tests/ -v

  release:
    name: Package Verified Release
    runs-on: ubuntu-latest
    needs: [lint, audit, test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Release Bundle & Compute Checksums
        run: |
          mkdir -p dist
          zip -r dist/ai-threat-scenario-generator-release.zip . \
            -x "*.git*" "*__pycache__*" "*.pytest_cache*" "*.ruff_cache*" "*.db" "*.sqlite*" "dist/*" "test-reports/*"
          cd dist
          sha256sum ai-threat-scenario-generator-release.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Candidate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-threat-scenario-generator-release-package
          path: dist/
          retention-days: 30
